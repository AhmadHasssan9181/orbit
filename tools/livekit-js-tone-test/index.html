<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveKit JS Tone Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10131a;
        color: #edf1f7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #10131a;
      }

      main {
        box-sizing: border-box;
        width: min(980px, 100%);
        margin: 0 auto;
        padding: 28px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 26px;
        font-weight: 700;
      }

      .panel {
        border: 1px solid #2b3242;
        border-radius: 8px;
        background: #171b24;
        padding: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #aeb7c8;
        font-size: 13px;
        font-weight: 600;
      }

      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #343c4d;
        border-radius: 6px;
        background: #0f1218;
        color: #edf1f7;
        font: inherit;
        padding: 10px 12px;
        outline: none;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: #6c7cff;
        box-shadow: 0 0 0 3px rgba(108, 124, 255, 0.18);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: #5664f5;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 40px;
        padding: 0 14px;
      }

      button.secondary {
        background: #2a3140;
      }

      button.danger {
        background: #bf3348;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0;
        color: #aeb7c8;
        font-size: 14px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #717989;
      }

      .dot.connected {
        background: #22c55e;
      }

      pre {
        box-sizing: border-box;
        width: 100%;
        min-height: 260px;
        margin: 16px 0 0;
        overflow: auto;
        border: 1px solid #2b3242;
        border-radius: 8px;
        background: #090b10;
        color: #cfd7e6;
        padding: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LiveKit JS Tone Test</h1>
      <section class="panel">
        <div class="grid">
          <label>
            LiveKit URL
            <input id="urlInput" type="url" placeholder="wss://matrix-org.livekit.cloud" autocomplete="off" />
          </label>
          <label>
            LiveKit JWT token
            <textarea id="tokenInput" spellcheck="false" autocomplete="off" placeholder="Paste token here"></textarea>
          </label>
        </div>

        <div class="actions">
          <button id="connectBtn">Connect</button>
          <button id="toneBtn" disabled>Publish 1 kHz Tone</button>
          <button id="micBtn" disabled>Publish Microphone</button>
          <button id="stopBtn" class="danger" disabled>Stop</button>
          <button id="clearBtn" class="secondary">Clear Log</button>
        </div>

        <div class="status">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">Disconnected</span>
        </div>

        <pre id="logOutput" aria-live="polite"></pre>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.19.1/dist/livekit-client.umd.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
