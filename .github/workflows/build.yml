name: build

# Why this exists at all
# ----------------------
# The suite had 507 tests across 52 files and nothing ran them. There was no CI
# configuration anywhere in this repository, which means:
#
#   - a regression could only be caught by whoever happened to run the tests;
#   - `main` could sit red for as long as nobody noticed;
#   - "it compiles" was an assertion in a commit message rather than a gate.
#
# The jobs below are deliberately cheap and platform-pinned, because the useful
# thing about CI is that it runs on every push without costing a Windows runner
# more than it has to.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails fast and for free. Most breakage is caught here.
  checks:
    name: Compile and unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # `--offline` is deliberately NOT used: the first run must resolve
      # dependencies. Note that `gradle.properties` must not carry a
      # machine-specific `org.gradle.java.home`; a path committed there breaks
      # every other clone before anything compiles.
      - name: Compile
        run: ./gradlew --no-daemon :app:compileKotlinJvm

      - name: Unit tests
        run: ./gradlew --no-daemon :app:jvmTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/jvmTest/
          retention-days: 7

  # Proves no credential is committed. Added after a live matrix.org access token,
  # an MXID, device id and both device identity keys were pushed in `scratch/`
  # during 17e1584.
  #
  # This does NOT remove a secret that is already in history -- only the
  # credential owner can revoke and rewrite. It stops the next one.
  secrets-scan:
    name: No committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for credential shapes
        run: |
          set -euo pipefail
          # Patterns are matched against tracked content only, and the output is
          # a log line, not the secret: gitleaks would be better but adds a
          # dependency, and a grep that prints file and line is enough to act on.
          if git grep -nIE \
            '(syt_[A-Za-z0-9_-]{20,}|mct_[A-Za-z0-9_-]{20,}|mat_[A-Za-z0-9_-]{20,})' \
            -- ':!*.md' ':!NOTICE' ':!security-audit/**'; then
            echo "::error::A Matrix token is committed above. Rotate it at the homeserver"
            echo "::error::and rewrite history -- .gitignore alone does not help."
            exit 1
          fi
          echo "no Matrix token shapes found in tracked files"

      - name: Confirm credential-bearing paths stay ignored
        run: |
          set -euo pipefail
          for p in scratch/ a-secret.env .env.local; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error::$p is tracked but must not be"
              exit 1
            fi
          done
          echo "credential-bearing paths are untracked"