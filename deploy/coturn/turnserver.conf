# coturn TURN/STUN configuration for the Orbit self-hosted stack.
# The static-auth-secret must match the `turn` section of livekit.yaml.

listening-port=3478
tls-listening-port=5349

# Relay UDP ports (open these on the firewall).
min-port=49160
max-port=49200

# Use long-term credentials via a shared secret (REST API auth, used by LiveKit).
#
# NOTE: this secret is what LiveKit authenticates against coturn's REST API. It is
# NOT the credential Synapse hands to 1:1 clients -- Synapse's `turn_servers`
# block in homeserver.yaml uses a plain shared username/password instead. If 1:1
# calls report "no media" while group calls are fine, the two have been conflated.
#
# coturn accepts the REST-secret mechanism and static `lt-cred-mech` users at the
# same time, but that combination is the part of this file most worth confirming
# on the first real run: `turnserver` logs which mechanism an allocation used, and
# "401/403 on allocation" means one of the two is not set up as intended.
use-auth-secret
static-auth-secret=<SET_SAME_SECRET_AS_LIVEKIT_YAML>

# Static user for Synapse's advertised turn_servers (1:1 P2P calls), so a 1:1 has
# a relay to fall back on. Use the same random pair in homeserver.yaml.
#lt-cred-mech
#--user=<shared-user>:<shared-password>

realm=orbit.example.com
server-name=orbit.example.com

# Logs
verbose
simple-log

# Security hardening
no-multicast-peers
no-cli
fingerprint
lt-cred-mech

# If coturn runs behind NAT, set the public IP:
# external-ip=<public-ip>/<private-ip>
