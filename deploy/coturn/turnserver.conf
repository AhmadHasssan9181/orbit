# coturn TURN/STUN configuration for the Orbit self-hosted stack.
# The static-auth-secret must match the `turn` section of livekit.yaml.

listening-port=3478
tls-listening-port=5349

# Relay UDP ports (open these on the firewall).
min-port=49160
max-port=49200

# Use long-term credentials via a shared secret (REST API auth, used by LiveKit).
use-auth-secret
static-auth-secret=<SET_SAME_SECRET_AS_LIVEKIT_YAML>

realm=orbit.example.com
server-name=orbit.example.com

# Logs
verbose
simple-log

# Security hardening
no-multicast-peers
no-cli
fingerprint
lt-cred-mech

# If coturn runs behind NAT, set the public IP:
# external-ip=<public-ip>/<private-ip>
