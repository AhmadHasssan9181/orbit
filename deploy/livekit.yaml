# LiveKit server configuration for the Orbit self-hosted stack.
# Docs: https://docs.livekit.io/oss/deployment/vm.md

port: 7880
# Public address clients connect to. Set to your domain in production.
# external_ip is used for NAT traversal (SERVER_NAT). Uncomment behind NAT:
# external_ip: <public-ip>

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  enable_loopback_candidate: false

turn:
  enabled: true
  # Must match the static-auth-secret in coturn/turnserver.conf.
  domain: turn.example.com
  cert_file: ""
  key_file: ""
  tls_port: 5349
  udp_port: 3478
  external_tls: true

keys:
  # SECURITY: no usable key/secret pair is committed.
  #
  # This used to ship `devkey: secret-placeholder-overridden-by-compose`, which was
  # only safe as long as docker-compose overrode it -- and it only does that when a
  # `.env` file exists. A `docker compose up` in a fresh clone ran the SFU with a
  # publicly known key and secret published in git, which is enough to mint a
  # LiveKit JWT for any room.
  #
  # LiveKit requires at least one key here to start, so an empty map would refuse to
  # boot rather than boot insecurely -- but the error is opaque. The placeholder is
  # kept only so the failure is an obviously-wrong credential rather than a
  # confusing parse error, and it is deliberately not a valid-looking secret.
  #
  # docker-compose passes LIVEKIT_KEYS from .env, which takes precedence over this
  # file. Generate real values with:
  #     openssl rand -hex 32
  # and put them in .env (see .env.example). To run bare metal instead, replace the
  # value below with your own generated secret -- and do not commit that file.
  REPLACE_WITH_YOUR_LIVEKIT_KEY: REPLACE_WITH_OUTPUT_OF_OPENSSL_RAND_HEX_32
