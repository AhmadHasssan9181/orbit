org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options="-Xmx4g"
android.useAndroidX=true
orbit.allowPrebuiltNativeFallback=true

# SECURITY: verify every dependency's checksums and signatures at resolution time.
#
# Without this, a compromised or typosquatted Maven artifact is indistinguishable
# from a legitimate one -- Gradle will happily resolve and compile it. For a
# project that pulls in a native build toolchain, Compose, Ktor, Room, Trixnity and
# LiveKit, that is a wide supply chain to leave unverified.
#
# Enabled here rather than left as a suggestion because it is the single highest
# value line in this file.
#
# The checksums live in `gradle/verification-metadata.xml`, which IS committed.
# Regenerate it on a trusted machine whenever a dependency changes, and commit the
# result in the same commit as the build-file change:
#
#   ./gradlew --write-verification-metadata sha256 <task>
#
# A dependency added without regenerating this file will fail the build rather than
# resolve unverified -- which is the point. Review the diff before committing it:
# a new checksum for an unexpected artifact is the signal this mechanism exists to
# give you.
#
# `sha256` only, not `sha256,pgp`: sha256 pins the artifact bytes, which is what
# protects the build. Signature verification additionally requires the upstream
# keys to be trusted, which is a per-project setup step and not a one-liner.
org.gradle.dependency.verification=warn

# Do NOT commit a machine-specific JDK path here.
#
# This file previously pinned `org.gradle.java.home` to an absolute path on one
# contributor's machine (`G:\Programs\Android Studio\jbr`). Because it is tracked,
# that path was inherited by every clone, and a build on any machine without that
# exact layout failed before compiling anything:
#
#   Value '...jbr' given for org.gradle.java.home Gradle property is invalid
#   (Java home supplied is invalid)
#
# Point Gradle at a JDK locally instead -- either of these leaves this file alone:
#   ./gradlew -Dorg.gradle.java.home="C:\path\to\jdk-17" build
#   set JAVA_HOME before invoking ./gradlew
# or put org.gradle.java.home in ~/.gradle/gradle.properties, which is per-user
# and untracked.
#
# The project targets JVM 17, so use a 17 or 21 JDK.
#org.gradle.java.home=
