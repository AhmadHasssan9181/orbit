distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip

# SECURITY: authenticate the distribution, do not just check the URL resolves.
#
# `validateDistributionUrl=true` on its own only proves services.gradle.org is
# reachable. It says nothing about whether the bytes are the ones Gradle published,
# which for a project that builds native binaries from source is the difference
# between a reproducible build and an arbitrary compiler. This hash is the one
# Gradle publishes at
# https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256
#
# Bump it whenever `distributionUrl` changes, or the wrapper refuses to start.
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78

networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
